        '500':
          $ref: '#/components/responses/Internal'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token <= 15 min; authorization resolved per baby via membership + database row-level security.
  parameters:
    BabyId:
      name: babyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Resources of babies without membership return 404.
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum:
        - occurred_at
        - -occurred_at
        - created_at
        - -created_at
        default: -occurred_at
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Record version
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/400
            title: Validation failed
            status: 400
    Unauthenticated:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/401
            title: Authentication required
            status: 401
    Forbidden:
      description: Role does not permit this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/403
            title: Role does not permit this action
            status: 403
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/404
            title: Not found
            status: 404
    DuplicateSuspected:
      description: Possible duplicate; resend with force=true to save
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/409
            title: Possible duplicate; resend with force=true to save
            status: 409
    ScheduleNotReleased:
      description: Schedule not released (verification pending)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/409
            title: Schedule not released (verification pending)
            status: 409
    ScanNotClean:
      description: Document not available until malware scan is CLEAN
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/409
            title: Document not available until malware scan is CLEAN
            status: 409
    VersionMismatch:
      description: Record changed; refetch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/412
            title: Record changed; refetch
            status: 412
    TooLarge:
      description: File too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/413
            title: File too large
            status: 413
    UnsupportedType:
      description: Unsupported media type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/415
            title: Unsupported media type
            status: 415
    RuleViolation:
      description: Business rule violated (e.g. quantity sent for DIRECT_BREASTFEEDING)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/422
            title: Business rule violated (e.g. quantity sent for DIRECT_BREASTFEEDING)
            status: 422
    RateLimited:
      description: Too many requests (see Retry-After)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/429
            title: Too many requests (see Retry-After)
            status: 429
    Internal:
      description: Internal error (support code provided)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.example/500
            title: Internal error (support code provided)
            status: 500
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        support_code:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    Audit:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        version:
          type: integer
    Provenance:
      type: object
      required:
      - source_id
      - organization
      - document_title
      - source_url
      - page_or_section
      - verification_status
      properties:
        source_id:
          type: string
        organization:
          type: string
        document_title:
          type: string
        document_type:
          type: string
        country:
          type: string
        population:
          type: string
        clinical_context:
          type: string
        source_url:
          type: string
        publication_date:
          type: string
        version:
          type: string
        page_or_section:
          type: string
        retrieved_at:
          type: string
        verified_at:
          type: string
        evidence_level:
          type: string
        verification_status:
          type: string
        notes:
          type: string
    Age:
      type: object
      properties:
        total_days:
          type: integer
          minimum: 0
        completed_weeks:
          type: integer
        remaining_days:
          type: integer
          minimum: 0
          maximum: 6
        completed_months:
          type: integer
        month_remainder_days:
          type: integer
        years:
          type: integer
        display:
          type: string
          examples:
          - 14 weeks 3 days
        hours_of_life:
          type:
          - integer
          - 'null'
        day_of_life:
          type:
          - integer
          - 'null'
        corrected_age_display:
          type:
          - string
          - 'null'
    BabyCreate:
      type: object
      required:
      - first_name
      - sex
      - birth_date
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 60
        nickname:
          type: string
          maxLength: 40
        sex:
          enum:
          - FEMALE
          - MALE
          - NOT_STATED
        birth_date:
          type: string
          format: date
          description: Must not be in the future (household tz)
        birth_time:
