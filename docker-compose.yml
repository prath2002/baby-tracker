# Local development database only. Production uses DATABASE_URL from the host environment.
# Host port 5434 so it doesn't clash with a native Postgres on 5432.
services:
  postgres:
    image: postgres:16
    container_name: baby-health-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
